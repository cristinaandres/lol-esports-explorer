name: deploy

# Pages serves a project site from /<repo>/, so the build takes its base path
# from the repository name rather than a hard-coded constant.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      # Rebuild the artifacts in the runner and compare bytes. This is the check
      # that makes "the committed JSON is current" a proof rather than a claim.
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'
      # The build's refusals are executable, so a change that turns one into a silent
      # pass fails here rather than in review. Same command `npm run check` runs.
      - name: pipeline refusals are covered
        run: uv run --project pipeline python -m pytest pipeline/tests
      - name: artifacts are current
        run: uv run --project pipeline python pipeline/build.py --check
      - name: build
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      - name: single-page fallback
        run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
