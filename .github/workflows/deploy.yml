name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    # The same gate review runs. The five steps live in check.yml so they cannot
    # drift between the pull request and the release that deploys; only the Pages
    # extras are switched on here, alongside the permissions above.
    uses: ./.github/workflows/check.yml
    with:
      pages_artifact: true

  deploy:
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
