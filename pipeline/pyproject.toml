[project]
name = "lol-esports-explorer-pipeline"
version = "0.1.0"
description = "Build the browser artifacts from the pinned dimensional model."
requires-python = ">=3.11"
# Pinned exactly: the artifacts are byte-compared in CI, so a different DuckDB
# must be a deliberate bump with a regenerated diff, not a silent upgrade.
dependencies = ["duckdb==2.0.0"]
